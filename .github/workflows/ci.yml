name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run acceptance tests
        run: node --test tests/*.test.mjs
